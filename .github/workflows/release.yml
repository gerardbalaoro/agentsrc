name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: jdx/mise-action@v5.2.8
        with:
          install_args: --locked bun
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile
      - name: Create version PR or publish npm package and GitHub release
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          pr-title: "chore: release agentsrc"
          commit-message: "chore: release agentsrc"
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - uses: actions/download-artifact@v8.0.2
        if: steps.changesets.outputs.published == 'true'
        with:
          pattern: binary-*
          path: release
          merge-multiple: true
      - name: Attach standalone binaries and checksums
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cat release/*.sha256 > release/SHA256SUMS
          gh release upload "v${version}" release/*.tar.gz release/*.sha256 release/SHA256SUMS --clobber
